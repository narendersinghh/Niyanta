; Niyanta: PHP settings for CGI/FastCGI shared hosts (mod_php reads the same values from .htaccess). Hosts that forbid .user.ini ignore this file.
expose_php = Off
display_errors = Off
log_errors = On
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
allow_url_include = Off
file_uploads = On
upload_max_filesize = 64M
post_max_size = 70M
memory_limit = 256M
max_execution_time = 120
