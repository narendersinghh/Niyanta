# Builds Niyanta Tracker (desktop/) for Windows, macOS and Linux. On a tag tracker-vX.Y.Z it attaches the installers, the
# auto-update files (latest*.yml) and the .blockmap files to the GitHub Release of that tag in THIS (private) repository,
# using the default GITHUB_TOKEN. Niyanta servers mirror that release with the token from Settings › Updates.
# Release: bump "version" in desktop/package.json, commit, then
#   git tag tracker-v1.2.0 && git push origin tracker-v1.2.0
# Release builds upload straight to a draft GitHub Release (no workflow artifacts, so the Actions storage quota is never
# used) and the last job publishes it once all three update files are there. Manual runs (workflow_dispatch) are test
# builds: workflow artifacts only, no release.
# Unsigned by default. Optional signing (see docs/RELEASING.md), each used only when its secrets exist:
#   Windows, Azure Trusted Signing: secrets AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET and repository variables
#     AZURE_TRUSTED_SIGNING_ENDPOINT, AZURE_TRUSTED_SIGNING_ACCOUNT, AZURE_TRUSTED_SIGNING_PROFILE
#   Windows, OV/EV certificate (.pfx): WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD
#   macOS: MAC_CSC_LINK, MAC_CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
name: Desktop tracker

on:
  push:
    tags: ['tracker-v*']
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: Release tag (tracker-vX.Y.Z), set by the Release workflow
        type: string
        required: true

permissions:
  contents: write
  actions: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: desktop-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - id: v
        shell: bash
        run: |
          have="$(node -p "require('./desktop/package.json').version")"
          if [[ "$TAG" == tracker-v* ]]; then
            want="${TAG#tracker-v}"
            if [ "$want" != "$have" ]; then echo "::error::Tag $TAG does not match desktop/package.json version $have. Bump the version, commit, and tag again."; exit 1; fi
          fi
          echo "version=$have" >> "$GITHUB_OUTPUT"
      - name: Create the draft release
        if: startsWith(env.TAG, 'tracker-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "Release $TAG exists"; exit 0; fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "Niyanta Tracker v${TAG#tracker-v}" \
            --notes "Niyanta Tracker v${TAG#tracker-v}. People download it from their workspace (Time Tracking › Get the desktop app); installed apps update themselves through the workspace."

  build:
    name: ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: windows-latest, name: Windows, script: 'dist:win' }
          - { os: macos-latest, name: macOS, script: 'dist:mac' }
          - { os: ubuntu-latest, name: Linux, script: 'dist:linux' }
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Build installers
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGN_ENDPOINT: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_SIGN_ACCOUNT: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_SIGN_PROFILE: ${{ vars.AZURE_TRUSTED_SIGNING_PROFILE }}
        run: |
          if [ -z "$CSC_LINK" ] && [ -z "$WIN_CSC_LINK" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; unset CSC_LINK CSC_KEY_PASSWORD WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; fi
          if [ -z "$CSC_LINK" ]; then unset CSC_LINK CSC_KEY_PASSWORD; fi
          # Notarize only when a Developer ID certificate and an Apple ID are configured (repository secrets).
          extra=()
          if [ "${{ matrix.name }}" = "macOS" ] && [ -n "$CSC_LINK" ] && [ -n "$APPLE_ID" ]; then extra+=("-c.mac.notarize=true"); fi
          # Windows: Azure Trusted Signing when its secrets and variables are set (electron-builder signs the app, the
          # installer and the uninstaller); otherwise the .pfx above, otherwise unsigned.
          if [ "${{ matrix.name }}" = "Windows" ] && [ -n "$AZURE_CLIENT_SECRET" ] && [ -n "$AZURE_TENANT_ID" ] && [ -n "$AZURE_CLIENT_ID" ]; then
            if [ -z "$AZURE_SIGN_ENDPOINT" ] || [ -z "$AZURE_SIGN_ACCOUNT" ] || [ -z "$AZURE_SIGN_PROFILE" ]; then echo "::error::Azure Trusted Signing secrets are set but the repository variables AZURE_TRUSTED_SIGNING_ENDPOINT / _ACCOUNT / _PROFILE are not."; exit 1; fi
            extra+=("-c.win.azureSignOptions.endpoint=$AZURE_SIGN_ENDPOINT" "-c.win.azureSignOptions.codeSigningAccountName=$AZURE_SIGN_ACCOUNT" "-c.win.azureSignOptions.certificateProfileName=$AZURE_SIGN_PROFILE")
            unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
          fi
          if [ -z "$AZURE_CLIENT_SECRET" ]; then unset AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET; fi
          npm run ${{ matrix.script }} -- "${extra[@]}"
      - name: List output
        shell: bash
        run: ls -la dist
      - name: Upload to the draft release
        if: startsWith(env.TAG, 'tracker-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(dist/*.exe dist/*.dmg dist/*.zip dist/*.AppImage dist/*.deb dist/*.blockmap dist/latest*.yml)
          [ ${#files[@]} -gt 0 ] || { echo "::error::No installers in dist"; exit 1; }
          for i in 1 2 3; do gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber && exit 0; echo "Upload failed, retrying"; sleep $((i * 10)); done
          exit 1
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(env.TAG, 'tracker-v') }}
        with:
          name: niyanta-tracker-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 1
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.blockmap
            desktop/dist/latest*.yml

  release:
    name: GitHub Release
    needs: [version, build]
    if: startsWith(github.ref, 'refs/tags/tracker-v') || startsWith(inputs.tag, 'tracker-v')
    runs-on: ubuntu-latest
    steps:
      - name: Check the update files and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          echo "$assets"
          for f in latest.yml latest-mac.yml latest-linux.yml; do grep -qx "$f" <<<"$assets" || { echo "::error::$f is missing"; exit 1; }; done
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
