# Builds Niyanta Tracker (desktop/) for Windows, macOS and Linux. On a tag tracker-vX.Y.Z it attaches the installers, the
# auto-update files (latest*.yml) and the .blockmap files to the GitHub Release of that tag in THIS (private) repository,
# using the default GITHUB_TOKEN. Niyanta servers mirror that release with the token from Settings › Updates.
# Release: bump "version" in desktop/package.json, commit, then
#   git tag tracker-v1.2.0 && git push origin tracker-v1.2.0
# Manual runs (workflow_dispatch) are test builds: workflow artifacts only, no release.
# Unsigned by default. Optional signing secrets: WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD, MAC_CSC_LINK, MAC_CSC_KEY_PASSWORD,
# APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID (see desktop/README.md).
name: Desktop tracker

on:
  push:
    tags: ['tracker-v*']
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: Release tag (tracker-vX.Y.Z), set by the Release workflow
        type: string
        required: true

permissions:
  contents: write
  actions: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: desktop-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - id: v
        shell: bash
        run: |
          have="$(node -p "require('./desktop/package.json').version")"
          if [[ "$TAG" == tracker-v* ]]; then
            want="${TAG#tracker-v}"
            if [ "$want" != "$have" ]; then echo "::error::Tag $TAG does not match desktop/package.json version $have. Bump the version, commit, and tag again."; exit 1; fi
          fi
          echo "version=$have" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: windows-latest, name: Windows, script: 'dist:win' }
          - { os: macos-latest, name: macOS, script: 'dist:mac' }
          - { os: ubuntu-latest, name: Linux, script: 'dist:linux' }
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Build installers
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CSC_LINK" ] && [ -z "$WIN_CSC_LINK" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; unset CSC_LINK CSC_KEY_PASSWORD WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; fi
          if [ -z "$CSC_LINK" ]; then unset CSC_LINK CSC_KEY_PASSWORD; fi
          # Notarize only when a Developer ID certificate and an Apple ID are configured (repository secrets).
          extra=""
          if [ "${{ matrix.name }}" = "macOS" ] && [ -n "$CSC_LINK" ] && [ -n "$APPLE_ID" ]; then extra="-c.mac.notarize=true"; fi
          npm run ${{ matrix.script }} -- $extra
      - name: List output
        shell: bash
        run: ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: niyanta-tracker-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 1
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.blockmap
            desktop/dist/latest*.yml

  release:
    name: GitHub Release
    needs: [version, build]
    if: startsWith(github.ref, 'refs/tags/tracker-v') || startsWith(inputs.tag, 'tracker-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: niyanta-tracker-*
          merge-multiple: true
      - name: Check the update files
        shell: bash
        run: |
          ls -la out
          for f in latest.yml latest-mac.yml latest-linux.yml; do test -s "out/$f" || { echo "::error::$f is missing"; exit 1; }; done
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Niyanta Tracker v${{ needs.version.outputs.version }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          body: |
            Niyanta Tracker v${{ needs.version.outputs.version }}. People download it from their workspace (Time Tracking › Get the desktop app); installed apps update themselves through the workspace.
          files: |
            out/*.exe
            out/*.dmg
            out/*.zip
            out/*.AppImage
            out/*.deb
            out/*.blockmap
            out/latest*.yml
      # The files now live on the GitHub Release; drop the build artifacts so they do not use the Actions storage quota.
      - uses: geekyeggo/delete-artifact@v5
        with:
          name: niyanta-tracker-*
          failOnError: false
