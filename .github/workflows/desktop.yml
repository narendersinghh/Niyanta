# Builds Niyanta Tracker (desktop/) for Windows, macOS and Linux. On a tag tracker-vX.Y.Z it attaches the installers, the
# auto-update files (latest*.yml) and the .blockmap files to the GitHub Release of that tag in THIS (private) repository,
# using the default GITHUB_TOKEN. Niyanta servers mirror that release with the token from Settings › Updates.
# Release: bump "version" in desktop/package.json, commit, then
#   git tag tracker-v1.2.0 && git push origin tracker-v1.2.0
# Release builds upload straight to a draft GitHub Release (no workflow artifacts, so the Actions storage quota is never
# used) and the last job publishes it once all three update files are there. Manual runs (workflow_dispatch) are test
# builds: workflow artifacts only, no release.
# Signing (desktop/SIGNING.md). Works with zero spend; every step below is a no-op when its secrets are not set:
#   macOS, free: the project's own self-signed certificate (desktop/scripts/make-mac-cert.sh, run once): secrets
#     MAC_SELF_CERT_P12 (base64) and MAC_SELF_CERT_PASSWORD. Every build then has the same code identity, so macOS keeps
#     the Screen Recording permission across updates. Without them: ad-hoc signature (as before).
#   Optional, paid (not needed): Windows Azure Trusted Signing (secrets AZURE_TENANT_ID, AZURE_CLIENT_ID,
#     AZURE_CLIENT_SECRET, variables AZURE_TRUSTED_SIGNING_ENDPOINT / _ACCOUNT / _PROFILE) or a .pfx (WIN_CSC_LINK,
#     WIN_CSC_KEY_PASSWORD); macOS Developer ID + notarization (MAC_CSC_LINK, MAC_CSC_KEY_PASSWORD, APPLE_ID,
#     APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID).
#   Optional Microsoft Store package (.appx, Microsoft signs it when it is published in the Store): repository variables
#     MS_STORE_IDENTITY_NAME and MS_STORE_PUBLISHER (from Partner Center); built after the NSIS installer, never blocks it.
name: Desktop tracker

on:
  push:
    tags: ['tracker-v*']
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: Release tag (tracker-vX.Y.Z), set by the Release workflow
        type: string
        required: true

permissions:
  contents: write
  actions: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: desktop-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Check version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - id: v
        shell: bash
        run: |
          have="$(node -p "require('./desktop/package.json').version")"
          if [[ "$TAG" == tracker-v* ]]; then
            want="${TAG#tracker-v}"
            if [ "$want" != "$have" ]; then echo "::error::Tag $TAG does not match desktop/package.json version $have. Bump the version, commit, and tag again."; exit 1; fi
          fi
          echo "version=$have" >> "$GITHUB_OUTPUT"
      - name: Create the draft release
        if: startsWith(env.TAG, 'tracker-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # drafts are found by listing (the tag lookup does not return drafts)
          id="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq "[.[] | select(.tag_name == \"$TAG\")][0].id // empty")"
          if [ -n "$id" ]; then echo "Release $TAG exists (id $id)"; exit 0; fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "Niyanta Tracker v${TAG#tracker-v}" \
            --notes "Niyanta Tracker v${TAG#tracker-v}. People download it from their workspace (Time Tracking › Get the desktop app); installed apps update themselves through the workspace."

  build:
    name: ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: windows-2025, name: Windows, script: 'dist:win' }
          - { os: macos-15, name: macOS, script: 'dist:mac' }
          - { os: ubuntu-24.04, name: Linux, script: 'dist:linux' }
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Import the macOS signing certificate (self-signed, free)
        if: matrix.name == 'macOS'
        shell: bash
        env:
          MAC_SELF_CERT_P12: ${{ secrets.MAC_SELF_CERT_P12 }}
          MAC_SELF_CERT_PASSWORD: ${{ secrets.MAC_SELF_CERT_PASSWORD }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
        run: |
          if [ -n "$MAC_CSC_LINK" ]; then echo "Developer ID certificate configured: electron-builder signs"; exit 0; fi
          if [ -z "$MAC_SELF_CERT_P12" ]; then echo "::notice::No MAC_SELF_CERT_P12 secret: the macOS app is signed ad hoc (Screen Recording must be allowed again after each update). See desktop/SIGNING.md."; exit 0; fi
          kc="$RUNNER_TEMP/niyanta-sign.keychain-db"; kpw="$(openssl rand -hex 16)"
          printf '%s' "$MAC_SELF_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kpw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kpw" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MAC_SELF_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kpw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security find-certificate -a -p "$kc" > "$RUNNER_TEMP/cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem" || echo "::warning::could not mark the certificate as trusted on the runner (signing still works)"
          sha="$(security find-identity -p codesigning "$kc" | awk '/[0-9A-F]{40}/ {print $2; exit}')"
          [ -n "$sha" ] || { echo "::error::The certificate in MAC_SELF_CERT_P12 has no code-signing identity"; exit 1; }
          echo "Signing identity $sha"
          echo "MAC_SELF_SIGN_IDENTITY=$sha" >> "$GITHUB_ENV"
          echo "MAC_SELF_SIGN_KEYCHAIN=$kc" >> "$GITHUB_ENV"
      - name: Build installers
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGN_ENDPOINT: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_SIGN_ACCOUNT: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_SIGN_PROFILE: ${{ vars.AZURE_TRUSTED_SIGNING_PROFILE }}
        run: |
          if [ -z "$CSC_LINK" ] && [ -z "$WIN_CSC_LINK" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; unset CSC_LINK CSC_KEY_PASSWORD WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; fi
          if [ -z "$CSC_LINK" ]; then unset CSC_LINK CSC_KEY_PASSWORD; fi
          # Notarize only when a Developer ID certificate and an Apple ID are configured (repository secrets).
          extra=()
          if [ "${{ matrix.name }}" = "macOS" ] && [ -n "$CSC_LINK" ] && [ -n "$APPLE_ID" ]; then extra+=("-c.mac.notarize=true"); fi
          # Windows: Azure Trusted Signing when its secrets and variables are set (electron-builder signs the app, the
          # installer and the uninstaller); otherwise the .pfx above, otherwise unsigned.
          if [ "${{ matrix.name }}" = "Windows" ] && [ -n "$AZURE_CLIENT_SECRET" ] && [ -n "$AZURE_TENANT_ID" ] && [ -n "$AZURE_CLIENT_ID" ]; then
            if [ -z "$AZURE_SIGN_ENDPOINT" ] || [ -z "$AZURE_SIGN_ACCOUNT" ] || [ -z "$AZURE_SIGN_PROFILE" ]; then echo "::error::Azure Trusted Signing secrets are set but the repository variables AZURE_TRUSTED_SIGNING_ENDPOINT / _ACCOUNT / _PROFILE are not."; exit 1; fi
            extra+=("-c.win.azureSignOptions.endpoint=$AZURE_SIGN_ENDPOINT" "-c.win.azureSignOptions.codeSigningAccountName=$AZURE_SIGN_ACCOUNT" "-c.win.azureSignOptions.certificateProfileName=$AZURE_SIGN_PROFILE")
            unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
          fi
          if [ -z "$AZURE_CLIENT_SECRET" ]; then unset AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET; fi
          npm run ${{ matrix.script }} -- "${extra[@]}"
      - name: List output
        shell: bash
        run: |
          ls -la dist
          # SHA-256 of what ships: what to look up / submit at https://www.microsoft.com/en-us/wdsi/filesubmission
          shopt -s nullglob; for f in dist/*.exe dist/*.dmg dist/*.zip dist/*.AppImage dist/*.deb; do
            if command -v sha256sum >/dev/null; then sha256sum "$f"; else shasum -a 256 "$f"; fi; done
      - name: Check the Windows version information
        if: matrix.name == 'Windows'
        shell: pwsh
        run: |
          $files = @(Get-ChildItem 'dist/win-unpacked/Niyanta Tracker.exe') + @(Get-ChildItem 'dist/*.exe')
          $bad = 0
          foreach ($f in $files) {
            $v = $f.VersionInfo
            "{0}: Company='{1}' Product='{2}' Description='{3}' Copyright='{4}' OriginalFilename='{5}' Version={6}" -f $f.Name, $v.CompanyName, $v.ProductName, $v.FileDescription, $v.LegalCopyright, $v.OriginalFilename, $v.ProductVersion
            "  signature: {0}" -f (Get-AuthenticodeSignature $f.FullName).Status
            foreach ($k in 'CompanyName', 'ProductName', 'FileDescription', 'LegalCopyright', 'ProductVersion') { if (-not $v.$k) { Write-Host "::error::$($f.Name) has no $k"; $bad++ } }
            if ($v.CompanyName -and $v.CompanyName -ne 'Niyanta') { Write-Host "::error::$($f.Name): publisher is '$($v.CompanyName)', expected 'Niyanta'"; $bad++ } }
          if ($bad) { exit 1 }
      - name: Check the macOS code identity
        if: matrix.name == 'macOS'
        shell: bash
        run: |
          for app in dist/mac*/"Niyanta Tracker.app"; do
            echo "$app"; codesign -d -r- "$app" 2>/dev/null | grep 'designated =>'
            codesign --verify --deep --strict "$app"
          done
      - name: Upload to the draft release
        if: startsWith(env.TAG, 'tracker-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(dist/*.exe dist/*.dmg dist/*.zip dist/*.AppImage dist/*.deb dist/*.blockmap dist/latest*.yml)
          [ ${#files[@]} -gt 0 ] || { echo "::error::No installers in dist"; exit 1; }
          # by release id: the tag lookup used by `gh release upload` does not find draft releases
          rid() { gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq "[.[] | select(.tag_name == \"$TAG\")][0].id // empty"; }
          id=; for i in 1 2 3 4 5 6; do id="$(rid || true)"; [ -n "$id" ] && break; echo "Draft release not visible yet, waiting"; sleep $((i * 10)); done
          [ -n "$id" ] || { echo "::error::No release for $TAG"; exit 1; }
          up() {
            local f="$1" n; n="$(basename "$f")"
            old="$(gh api "repos/$GITHUB_REPOSITORY/releases/$id/assets?per_page=100" --jq ".[] | select(.name == \"$n\") | .id")"
            [ -z "$old" ] || gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old" >/dev/null
            gh api -X POST "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$id/assets?name=$n" -H "Content-Type: application/octet-stream" --input "$f" --jq .name; }
          for f in "${files[@]}"; do
            ok=; for i in 1 2 3; do if up "$f"; then ok=1; break; fi; echo "Upload of $f failed, retrying"; sleep $((i * 10)); done
            [ -n "$ok" ] || { echo "::error::Could not upload $f"; exit 1; }
          done
      - uses: actions/upload-artifact@v5
        if: ${{ !startsWith(env.TAG, 'tracker-v') }}
        with:
          name: niyanta-tracker-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 1
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.blockmap
            desktop/dist/latest*.yml
      - name: Microsoft Store package (optional)
        if: matrix.name == 'Windows' && vars.MS_STORE_IDENTITY_NAME != '' && vars.MS_STORE_PUBLISHER != ''
        continue-on-error: true
        shell: bash
        env:
          MS_STORE_IDENTITY_NAME: ${{ vars.MS_STORE_IDENTITY_NAME }}
          MS_STORE_PUBLISHER: ${{ vars.MS_STORE_PUBLISHER }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx electron-builder --win appx --x64 --publish never "-c.appx.identityName=$MS_STORE_IDENTITY_NAME" "-c.appx.publisher=$MS_STORE_PUBLISHER" \
            "-c.appx.publisherDisplayName=Niyanta" "-c.appx.applicationId=NiyantaTracker" "-c.appx.displayName=Niyanta Tracker"
          ls -la dist/*.appx
      - uses: actions/upload-artifact@v5
        if: matrix.name == 'Windows' && vars.MS_STORE_IDENTITY_NAME != '' && vars.MS_STORE_PUBLISHER != ''
        continue-on-error: true
        with:
          name: niyanta-tracker-microsoft-store
          if-no-files-found: ignore
          retention-days: 7
          path: desktop/dist/*.appx
      - name: Remove the signing keychain
        if: always() && matrix.name == 'macOS'
        shell: bash
        run: if [ -n "${MAC_SELF_SIGN_KEYCHAIN:-}" ]; then security delete-keychain "$MAC_SELF_SIGN_KEYCHAIN" || true; fi

  release:
    name: GitHub Release
    needs: [version, build]
    if: startsWith(github.ref, 'refs/tags/tracker-v') || startsWith(inputs.tag, 'tracker-v')
    runs-on: ubuntu-24.04
    steps:
      - name: Check the update files and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq "[.[] | select(.tag_name == \"$TAG\")][0].id // empty")"
          [ -n "$id" ] || { echo "::error::No release for $TAG"; exit 1; }
          assets="$(gh api "repos/$GITHUB_REPOSITORY/releases/$id/assets?per_page=100" --jq '.[].name')"
          echo "$assets"
          for f in latest.yml latest-mac.yml latest-linux.yml; do grep -qx "$f" <<<"$assets" || { echo "::error::$f is missing"; exit 1; }; done
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -F draft=false -f tag_name="$TAG" --jq .html_url
